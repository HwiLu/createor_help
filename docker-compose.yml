services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_change_me
      MYSQL_DATABASE: creatorhub
      MYSQL_USER: creatorhub
      MYSQL_PASSWORD: creatorhub_password_change_me
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_SECRET_KEY: change-me-to-a-long-random-string
      DATABASE_URL: mysql+pymysql://creatorhub:creatorhub_password_change_me@db:3306/creatorhub?charset=utf8mb4
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      WECHAT_REDIRECT_URI: ${WECHAT_REDIRECT_URI:-http://localhost:8000/api/v1/auth/wechat/callback}
      SESSION_COOKIE_SECURE: "true"
      MOCK_LOGIN_ENABLED: "false"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads

volumes:
  mysql_data:
  uploads_data:
